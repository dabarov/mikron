<!doctype html>
<!-- Store-screenshot page: a light team-settings panel whose invite callout is measured up close. Fictional content. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team</title>
<style>
  :root {
    --bg: #eef0f4; --surface: #ffffff; --ink: #15171b; --muted: #626a77; --line: #e0e3e9; --brand: #4f46e5;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(rgba(20,22,26,.075) 1px, transparent 1.4px); background-size: 16px 16px; background-position: 8px 8px; }
  .panel { width: 420px; margin: 40px auto; padding: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: 0 1px 2px rgba(20,22,26,.05), 0 18px 40px rgba(20,22,26,.08); }
  h1 { margin: 0 0 2px; font-size: 17px; line-height: 24px; letter-spacing: -.01em; }
  .sub { margin: 0 0 28px; color: var(--muted); font-size: 13px; line-height: 18px; }
  .callout { display: flex; align-items: center; gap: 16px; padding: 16px 20px 16px 16px; border-radius: 16px; background: #f5f5ff; border: 1px solid #e3e3fb; }
  .tile { flex: none; width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #818cf8, #4f46e5); display: grid; place-items: center; box-shadow: 0 4px 10px rgba(79,70,229,.25); }
  .tile svg { display: block; }
  .copy { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .copy strong { font-size: 15px; line-height: 20px; font-weight: 600; }
  .copy span { color: var(--muted); font-size: 13px; line-height: 18px; }
  .btn { flex: none; display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 10px; background: var(--brand); color: #fff; font: 600 14px/20px var(--font); text-decoration: none; }
  .members { list-style: none; margin: 40px 0 0; padding: 0; }
  .members li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .av { width: 32px; height: 32px; border-radius: 50%; flex: none; }
  .members b { font-weight: 600; font-size: 14px; }
  .members em { margin-left: auto; font-style: normal; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
  <main class="panel" id="panel">
    <h1>Team</h1>
    <p class="sub">Four seats used of five on this plan.</p>
    <div class="callout" id="callout">
      <div class="tile"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><path d="M18 8v6M15 11h6"/></svg></div>
      <div class="copy"><strong>Invite your team</strong><span>Reviews move faster with everyone in.</span></div>
      <a class="btn" href="#invite">Invite</a>
    </div>
    <ul class="members">
      <li><span class="av" style="background:linear-gradient(135deg,#fcd34d,#f97316)"></span><b>You</b><em>Owner</em></li>
      <li><span class="av" style="background:linear-gradient(135deg,#6ee7b7,#0ea5e9)"></span><b>Design review</b><em>Editor</em></li>
    </ul>
  </main>
</body>
</html>
