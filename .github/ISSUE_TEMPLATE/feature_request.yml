name: Feature request
description: Suggest a change or an addition.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Mikron does one thing: measuring what is on the page you are looking at. Requests that fit that purpose are most likely to be accepted. Mikron makes no network requests and collects no data, and that will not change.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation and what is hard about it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Mikron to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Links, sketches, example pages.
