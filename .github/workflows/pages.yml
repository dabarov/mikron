# Builds the project website (tools/build-site.mjs) and publishes it to GitHub Pages:
# https://dabarov.github.io/mikron/
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "extension/**"
      - "store/assets/hero.gif"
      - "store/assets/social-preview-1280x640.png"
      - "tools/build-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the site
        run: node tools/build-site.mjs --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
