<!doctype html>
<html><head><meta charset="utf-8"><title>scan spans</title>
<style>
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; padding: 16px; }
  .code { font: 12px/16px monospace; margin: 0; }
  .t0 { color: #c00; } .t1 { color: #080; } .t2 { color: #00c; } .t3 { color: #a0a; } .t4 { color: #555; } .t5 { background: #ffd; }
</style></head><body>
<pre class="code" id="code"></pre>
<script>
  // one <span> per token, separated by plain spaces: 600 lines x 25 tokens
  const out = [];
  for (let l = 0; l < 600; l++) {
    for (let k = 0; k < 25; k++) out.push(`<span class="t${k % 6}">tok${k}</span> `);
    out.push('\n');
  }
  document.getElementById('code').innerHTML = out.join('');
</script>
</body></html>
