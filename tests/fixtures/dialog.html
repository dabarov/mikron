<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>dialog fixture</title>
<style>html,body{margin:0}body{background:#f0f0f0;height:600px;font:14px system-ui}
dialog{padding:24px;border:0;border-radius:14px;width:360px;top:60px;left:0;right:0;margin:0 auto;position:fixed}
dialog::backdrop{background:rgba(0,0,0,.4)}
.row{display:flex;gap:12px;margin-top:12px}.row span{width:60px;height:40px;background:#dde;border-radius:8px;display:block}</style></head>
<body><p>Page behind the modal.</p>
<dialog id="dlg"><h3 style="margin:0">Modal title</h3><p>Dialog body text that is long enough to wrap.</p><div class="row"><span></span><span></span><span></span></div><button id="close" type="button">Close</button></dialog>
<script>
  window.__cancels = 0; window.__closes = 0;
  const d = document.getElementById('dlg');
  d.addEventListener('cancel', () => window.__cancels++);
  d.addEventListener('close', () => window.__closes++);
  d.showModal();
</script></body></html>
