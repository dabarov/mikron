<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nested scroller fixture, varied rows</title>
<style>html,body{margin:0}body{background:#fff;font:15px/20px system-ui;height:1400px;position:relative}
#sc{position:absolute;left:40px;top:40px;width:300px;height:240px;overflow:auto;background:#f6f6f8;border-radius:10px}
#sc ul{list-style:none;margin:0;padding:0}
#sc li{margin:0 0 12px;padding:8px 14px;box-sizing:border-box;background:#e2e6f0;border-radius:8px}</style></head>
<body><div id="sc"><ul>
<li id="r1" style="height:38px">Row 1</li><li id="r2" style="height:44px">Row 2</li><li id="r3" style="height:50px">Row 3</li><li id="r4" style="height:56px">Row 4</li><li id="r5" style="height:62px">Row 5</li><li id="r6" style="height:68px">Row 6</li><li id="r7" style="height:74px">Row 7</li><li id="r8" style="height:80px">Row 8</li><li id="r9" style="height:86px">Row 9</li><li id="r10" style="height:92px">Row 10</li>
</ul></div></body></html>
