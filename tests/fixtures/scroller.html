<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>nested scroller fixture</title>
<style>html,body{margin:0}body{background:#fff;font:15px/20px system-ui;height:1400px;position:relative}
#sc{position:absolute;left:40px;top:40px;width:300px;height:240px;overflow:auto;background:#f6f6f8;border-radius:10px}
#sc ul{list-style:none;margin:0;padding:0}
#sc li{height:40px;margin:0 0 12px;padding:8px 14px;box-sizing:border-box;background:#e2e6f0;border-radius:8px}</style></head>
<body><div id="sc"><ul>
<li>Row 1</li><li>Row 2</li><li>Row 3</li><li>Row 4</li><li>Row 5</li><li>Row 6</li><li>Row 7</li><li>Row 8</li><li>Row 9</li><li>Row 10</li><li>Row 11</li><li>Row 12</li>
</ul></div></body></html>
