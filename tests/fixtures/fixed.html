<html lang="en"><head><meta charset="utf-8"><title>fixed fixture</title>
<style>html,body{margin:0}body{background:#fff;height:3000px;position:relative}

#flow{position:absolute;left:40px;top:500px;width:160px;height:80px;background:#ccd;border-radius:8px}</style></head>
<body><div id="fx"></div><div id="flow"></div></body></html>
