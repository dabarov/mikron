<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>gesture fixture</title>
<style>
  html, body { margin: 0; }
  body { font: 16px/20px system-ui, sans-serif; background: #fafafa; color: #111; height: 2400px; position: relative; }
  .box { position: absolute; background: #dfe7f1; border-radius: 12px; padding: 10px; }
  #a { left: 40px; top: 40px; width: 200px; height: 100px; box-sizing: border-box; }
  #b { left: 300px; top: 60px; width: 120px; height: 80px; box-sizing: border-box; border-radius: 8px; }
  #c { left: 480px; top: 200px; width: 160px; height: 160px; box-sizing: border-box; border-radius: 20px; }
  #txt { position: absolute; left: 40px; top: 200px; width: 380px; margin: 0; }
  #far { left: 40px; top: 1200px; width: 200px; height: 100px; box-sizing: border-box; }
</style></head>
<body>
  <div class="box" id="a">Alpha</div>
  <div class="box" id="b">Beta</div>
  <div class="box" id="c">Gamma</div>
  <p id="txt">The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs. Sphinx of black quartz, judge my vow.</p>
  <div class="box" id="far">Far down</div>
</body></html>
