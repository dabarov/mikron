<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>app shell fixture</title>
<style>html,body{margin:0;height:100%;overflow:hidden}
#shell{position:fixed;inset:0;overflow:auto;background:#fafafa}
#content{height:3000px;position:relative}
.blk{position:absolute;left:60px;width:240px;height:120px;background:#dde6f0;border-radius:12px;padding:12px;box-sizing:border-box}
#b1{top:60px}#b2{top:260px}#b3{top:460px}#b4{top:900px}</style></head>
<body><div id="shell"><div id="content">
<div class="blk" id="b1">one</div><div class="blk" id="b2">two</div><div class="blk" id="b3">three</div><div class="blk" id="b4">four</div>
</div></div></body></html>
