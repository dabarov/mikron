<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>shadow fixture</title>
<style>html,body{margin:0}body{background:#fff;position:relative;height:600px}
#host{position:absolute;left:40px;top:40px;display:block}</style></head>
<body><div id="host"></div>
<script>
  const r = document.getElementById('host').attachShadow({ mode: 'open' });
  r.innerHTML = '<style>.box{width:300px;height:140px;box-sizing:border-box;padding:20px;background:#ecfdf5;border-radius:14px;display:flex;gap:16px;align-items:flex-start}' +
    'button{width:120px;height:40px;border:0;border-radius:10px;background:#059669;color:#fff}</style>' +
    '<div class="box"><button type="button">One</button><button type="button">Two</button></div>';
</script></body></html>
