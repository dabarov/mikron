<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>preventDefault pointerdown fixture</title>
<style>html,body{margin:0}body{background:#fff;height:600px;position:relative}
#app{position:absolute;left:40px;top:40px;width:400px;height:300px;background:#eef;border-radius:10px;padding:16px;box-sizing:border-box}
#app div{background:#ccd;height:60px;margin-bottom:12px;border-radius:6px}</style></head>
<body><div id="app"><div></div><div></div><div></div></div>
<script>
  // Like many canvas/drag libraries: kill compatibility mouse events.
  document.getElementById('app').addEventListener('pointerdown', (e) => e.preventDefault());
</script></body></html>
